<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4b2e83" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&display=swap"
    />
    <!-- The events and clubs the first page is made of: asked for right away, alongside the
         site's code, instead of only once that code has downloaded and started running. -->
    <link rel="preload" href="/events.json" as="fetch" crossorigin />
    <link rel="preload" href="/clubs.json" as="fetch" crossorigin />
    <title>DubHub</title>
    <meta name="description" content="See what UW students are doing right now: club events, study sessions, game nights, and more, all on one map." />
    <!-- The preview card when the link is shared (iMessage, Instagram, Discord, Slack...). Link
         previews need the picture's full address. The picture: public/og-image.jpg, 1200x630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DubHub" />
    <meta property="og:title" content="DubHub: what UW students are doing right now" />
    <meta property="og:description" content="Club events, study sessions and more, all on one campus map." />
    <meta property="og:url" content="https://dubhub-test.vercel.app/" />
    <meta property="og:image" content="https://dubhub-test.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DubHub: what UW students are doing right now, on a map of campus" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
